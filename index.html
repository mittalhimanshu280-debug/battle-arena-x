
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Arena X</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial}
#hud{position:fixed;top:12px;left:12px;color:white;z-index:5;font-weight:bold;line-height:2}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-around;z-index:5}
button{padding:16px;border:0;border-radius:12px;background:#e9a52c;font-weight:bold}
</style>
</head>
<body>
<div id="hud">
 BATTLE ARENA X<br>
 HEALTH: 100<br>
 ENEMY: <span id="eh">100</span><br>
 SCORE: <span id="score">0</span>
</div>
<div id="controls">
<button onclick="move(-1)">LEFT</button>
<button onclick="move(1)">RIGHT</button>
<button onclick="shoot()">FIRE 🔫</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445533,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x4b7541}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

function soldier(color){
 const g=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color});
 const skin=new THREE.MeshStandardMaterial({color:0xd6a77a});
 const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.4,.5),mat);
 body.position.y=1;
 g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,16),skin);
 head.position.y=2;
 g.add(head);
 return g;
}

const player=soldier(0x263d55);
scene.add(player);

const enemy=soldier(0x9b3326);
enemy.position.set(0,0,-14);
scene.add(enemy);

for(let i=0;i<20;i++){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(
 new THREE.CylinderGeometry(.15,.2,2),
 new THREE.MeshStandardMaterial({color:0x654321}));
 trunk.position.y=1;
 tree.add(trunk);
 const leaves=new THREE.Mesh(
 new THREE.ConeGeometry(1,3,8),
 new THREE.MeshStandardMaterial({color:0x175b27}));
 leaves.position.y=3;
 tree.add(leaves);
 tree.position.set(Math.random()*35-17,0,-Math.random()*40-5);
 scene.add(tree);
}

let bullets=[];
let enemyHealth=100;
let score=0;
let enemyAlive=true;

function move(x){
 player.position.x=Math.max(-8,Math.min(8,player.position.x+x*.6));
}

function shoot(){
 if(!enemyAlive)return;
 const b=new THREE.Mesh(
 new THREE.SphereGeometry(.13,8,8),
 new THREE.MeshBasicMaterial({color:0xffff00}));
 b.position.set(player.position.x,1.3,-.5);
 scene.add(b);
 bullets.push(b);
}

window.move=move;
window.shoot=shoot;

function respawn(){
 enemy.position.set(Math.random()*8-4,0,-14);
 enemyHealth=100;
 enemyAlive=true;
 document.getElementById("eh").innerText=100;
}

function animate(){
 requestAnimationFrame(animate);

 for(let i=bullets.length-1;i>=0;i--){
 const b=bullets[i];
 b.position.z-=.8;

 if(enemyAlive && b.position.distanceTo(
 new THREE.Vector3(enemy.position.x,1.2,-14))<1.5){
 enemyHealth-=25;
 scene.remove(b);
 bullets.splice(i,1);
 document.getElementById("eh").innerText=Math.max(0,enemyHealth);

 if(enemyHealth<=0){
 enemyAlive=false;
 enemy.visible=false;
 score+=100;
 document.getElementById("score").innerText=score;
 setTimeout(()=>{
 enemy.visible=true;
 respawn();
 },1200);
 }
 continue;
 }

 if(b.position.z < -50){
 scene.remove(b);
 bullets.splice(i,1);
 }
 }

 camera.position.x=player.position.x;
 camera.lookAt(player.position.x,1,0);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
