
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Arena X 3D</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial}
#hud{position:fixed;top:12px;left:12px;color:white;z-index:5;font-weight:bold}
#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-around;z-index:5}
button{padding:17px;border:0;border-radius:12px;background:#e9a52c;font-weight:bold}
</style>
</head>
<body>
<div id="hud">BATTLE ARENA X<br>HEALTH: 100</div>
<div id="controls">
<button onclick="move(-1)">LEFT</button>
<button onclick="move(1)">RIGHT</button>
<button onclick="shoot()">FIRE 🔫</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,5,10);
camera.lookAt(0,1,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445533,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({color:0x4b7541})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.BoxGeometry(0.8,1.4,0.5),
 new THREE.MeshStandardMaterial({color:0x263d55})
);
body.position.y=1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.32,16,16),
 new THREE.MeshStandardMaterial({color:0xd6a77a})
);
head.position.y=2;
player.add(head);
scene.add(player);

const gun=new THREE.Mesh(
 new THREE.BoxGeometry(0.2,0.2,1),
 new THREE.MeshStandardMaterial({color:0x222222})
);
gun.position.set(0.5,1.2,-0.5);
player.add(gun);

for(let i=0;i<20;i++){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.15,0.2,2),
  new THREE.MeshStandardMaterial({color:0x654321})
 );
 trunk.position.y=1;
 tree.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1,3,8),
  new THREE.MeshStandardMaterial({color:0x175b27})
 );
 leaves.position.y=3;
 tree.add(leaves);
 tree.position.set(Math.random()*35-17,0,-Math.random()*40-5);
 scene.add(tree);
}

let bullets=[];
function move(x){player.position.x+=x*0.5;}

function shoot(){
 const bullet=new THREE.Mesh(
  new THREE.SphereGeometry(0.12,8,8),
  new THREE.MeshBasicMaterial({color:0xffff00})
 );
 bullet.position.copy(player.position);
 bullet.position.y=1.3;
 bullet.position.z=-1;
 scene.add(bullet);
 bullets.push(bullet);
}

window.move=move;
window.shoot=shoot;

function animate(){
 requestAnimationFrame(animate);
 bullets.forEach((b,i)=>{
  b.position.z-=0.8;
  if(b.position.z < -50){
   scene.remove(b);
   bullets.splice(i,1);
  }
 });
 camera.position.x=player.position.x;
 camera.lookAt(player.position.x,1,0);
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
